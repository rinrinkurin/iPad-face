<div class="shell" id="home"><h2>おばあちゃんロボット</h2><p class="small">指定した画像をそのまま基本の顔に使用。スマホカメラの表情をiPadへ同期できます。</p><div class="panel stack"><button id="ipadBtn">iPad：顔を表示する</button><button id="phoneBtn" class="alt">スマホ：カメラで表情を送る</button><button id="demoBtn" class="alt">デモ：顔だけ動かしてみる</button></div><p class="small">公開したHTTPSのサイトを、スマホとiPadの両方で開いてください。通信にPeerJS、表情認識にMediaPipeを利用します。</p></div>
<div id="facePage"><canvas id="faceCanvas" width="1586" height="992"></canvas><div id="faceTop"><button id="faceExit">戻る</button><div class="chip" id="receiverStatus">接続準備中…</div></div></div>
<div class="controller hidden" id="controller"><h2>スマホ：表情を送信</h2><div class="panel stack"><label for="peerCode">iPadに表示された接続コード</label><input id="peerCode" placeholder="接続コードを入力" autocapitalize="off" autocomplete="off" spellcheck="false"><button id="connectBtn">iPadに接続する</button><button id="startCamera">カメラを起動する</button><p class="small" id="phoneStatus">接続前</p><p class="small">カメラ映像は送らず、表情の数値だけを送信します。</p></div><video id="camera" autoplay playsinline muted></video><div class="panel"><div class="meters"><div>口の開き <span id="jawNum">0%</span><div class="meter"><div id="jawBar"></div></div></div><div>笑顔 <span id="smileNum">0%</span><div class="meter"><div id="smileBar"></div></div></div><div>まばたき <span id="blinkNum">0%</span><div class="meter"><div id="blinkBar"></div></div></div></div><p class="small">スマホの顔を正面から明るく映してください。最初のカメラ起動で認識モデルのダウンロードが必要です。</p><p id="err"></p><button id="phoneBack" class="alt">戻る</button></div></div>

const orig=new Image(),clean=new Image(); orig.src=IMG_ORIG;clean.src=IMG_CLEAN;

const $=id=>document.getElementById(id),clamp=x=>Math.max(0,Math.min(1,x));

$('faceExit').onclick=goHome;$('phoneBack').onclick=goHome;
function randomCode(){return 'oba-'+Math.random().toString(36).slice(2,9)}
function createPeer(id){return new Promise((resolve,reject)=>{if(typeof Peer==='undefined')return reject(Error('通信ライブラリを読み込めませんでした。インターネットを確認してください。'));const p=id?new Peer(id,{debug:0}):new Peer({debug:0});p.on('open',()=>resolve(p));p.on('error',reject)})}
$('ipadBtn').onclick=async()=>{show('facePage');$('receiverStatus').textContent='接続コードを作成中…';try{peer=await createPeer(randomCode());$('receiverStatus').textContent='接続コード：'+peer.id;peer.on('connection',c=>{if(conn)conn.close();conn=c;conn.on('open',()=>{$('receiverStatus').textContent='スマホと接続中 ✓'});conn.on('data',d=>{if(d&&d.type==='expression'){target.jaw=clamp(+d.jaw||0);target.smile=clamp(+d.smile||0);target.blink=clamp(+d.blink||0);target.brow=clamp(+d.brow||0);lastSeen=Date.now()}});conn.on('close',()=>{$('receiverStatus').textContent='接続が切れました：'+peer.id})})}catch(e){$('receiverStatus').textContent='通信エラー：'+e.message}};
$('demoBtn').onclick=()=>{show('facePage');$('receiverStatus').textContent='デモモード（自動で表情が変わります）'};
$('phoneBtn').onclick=()=>show('controller');
$('connectBtn').onclick=async()=>{try{if(conn)conn.close();if(peer)peer.destroy();$('phoneStatus').textContent='接続しています…';peer=await createPeer();let code=$('peerCode').value.trim();if(!code)throw Error('iPadの接続コードを入力してください');conn=peer.connect(code,{reliable:false});conn.on('open',()=>{$('phoneStatus').textContent='iPadと接続済み ✓'});conn.on('close',()=>{$('phoneStatus').textContent='接続が切れました'});conn.on('error',e=>{$('phoneStatus').textContent='接続エラー：'+e.message});setTimeout(()=>{if(conn&&!conn.open)$('phoneStatus').textContent='接続できません。接続コードと通信環境を確認してください。'},12000)}catch(e){$('phoneStatus').textContent=e.message}};
$('startCamera').onclick=async()=>{let b=$('startCamera');b.disabled=true;$('err').textContent='';try{
if(!window.isSecureContext)throw Error('カメラにはHTTPSで公開したWebサイトが必要です。');
$('phoneStatus').textContent='カメラを準備しています…';
camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:false});$('camera').srcObject=camStream;await $('camera').play();
$('phoneStatus').textContent='顔認識モデルを読み込んでいます…';
// Safariで読み込めるMediaPipeの配布形式を順番に試す。
let mediaPipeModule, importErrors=[];
for (const url of [
  'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/vision_bundle.mjs',
  'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/+esm',
  'https://esm.sh/@mediapipe/tasks-vision@0.10.22'
]) {
  try {
    const imported=await import(url);
    const candidate=imported.FaceLandmarker ? imported : imported.default;
    if(candidate && candidate.FaceLandmarker && candidate.FilesetResolver){mediaPipeModule=candidate;break;}
    importErrors.push(url+': エクスポートが見つかりません');
  }catch(e){importErrors.push(url+': '+e.message);}
}
if(!mediaPipeModule)throw Error('表情認識ライブラリの読み込みに失敗しました。Safariの通信・コンテンツブロッカーを確認してください。\n'+importErrors.join('\n'));
const {FaceLandmarker,FilesetResolver}=mediaPipeModule;
const vision=await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm');
landmarker=await FaceLandmarker.createFromOptions(vision,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',delegate:'CPU'},runningMode:'VIDEO',numFaces:1,outputFaceBlendshapes:true});
$('phoneStatus').textContent='カメラ認識中 ✓　顔を動かしてください';requestAnimationFrame(processFace)
}catch(e){$('err').textContent='カメラ開始エラー：'+e.message;$('phoneStatus').textContent='開始できませんでした';b.disabled=false}};
function processFace(t){if(!camStream||mode!=='controller'||!landmarker)return;let vid=$('camera');if(vid.readyState>=2&&t-latestFrame>85){latestFrame=t;try{let r=landmarker.detectForVideo(vid,performance.now());if(r.faceBlendshapes?.length){const m={};r.faceBlendshapes[0].categories.forEach(c=>m[c.categoryName]=c.score);const avg=(a,b)=>((m[a]||0)+(m[b]||0))/2;
let jaw=clamp((m.jawOpen||0)*1.7),smile=clamp(avg('mouthSmileLeft','mouthSmileRight')*1.9),blink=clamp(avg('eyeBlinkLeft','eyeBlinkRight')*1.35),brow=clamp((m.browInnerUp||0)*1.8);
const d={type:'expression',jaw,smile,blink,brow};if(conn&&conn.open)conn.send(d);
for(let k of ['jaw','smile','blink']){$(k+'Bar').style.width=Math.round(d[k]*100)+'%';$(k+'Num').textContent=Math.round(d[k]*100)+'%'}
}else{$('phoneStatus').textContent='顔が検出されません。カメラの正面に顔を映してください。'} }catch(e){$('err').textContent=e.message}}requestAnimationFrame(processFace)}
// Original image is used pixel-for-pixel at rest; only animation regions get overlays.
function drawBlink(amount){if(amount<.03)return;for(let flip of [false,true]){ctx.save();if(flip){ctx.translate(W,0);ctx.scale(-1,1)}const x=427,y=452;
// warm skin patch over eye, fades in as eyelid closes
const opacity=clamp((amount-.03)*1.3);ctx.globalAlpha=opacity;let grad=ctx.createRadialGradient(x,y-8,30,x,y,205);grad.addColorStop(0,'#ffddcc');grad.addColorStop(.8,'#ffdbc9');grad.addColorStop(1,'#f8cdbb');ctx.fillStyle=grad;ctx.beginPath();ctx.ellipse(x,y,195,101,0,0,Math.PI*2);ctx.fill();
ctx.globalAlpha=opacity;ctx.strokeStyle='#7b4939';ctx.lineCap='round';ctx.lineWidth=11;ctx.beginPath();ctx.moveTo(244,480);ctx.quadraticCurveTo(430,493,578,482);ctx.stroke();ctx.restore()}}
function drawMouth(jaw,smile){if(jaw<.025&&smile<.15)return;
// replace only smile curve section with the same image after local inpainting
ctx.save();ctx.beginPath();ctx.ellipse(793,795,240,68,0,0,Math.PI*2);ctx.clip();ctx.drawImage(clean,0,0,W,H);ctx.restore();
let opening=jaw*65;const cy=799;ctx.lineCap='round';ctx.lineJoin='round';
if(opening<3){ctx.strokeStyle='#784031';ctx.lineWidth=18;ctx.beginPath();ctx.moveTo(580,780);ctx.quadraticCurveTo(793,846+smile*15,952,780);ctx.stroke();return}
// smoothly open mouth centered where original line was
let halfW=clamp(.55+jaw*.55)*185;let upper=cy-8-jaw*12,lower=cy+opening;
ctx.beginPath();ctx.moveTo(793-halfW,upper);ctx.quadraticCurveTo(793,upper+20+smile*7,793+halfW,upper);ctx.quadraticCurveTo(793,lower+36,793-halfW,upper);ctx.closePath();ctx.fillStyle='#713c37';ctx.fill();ctx.strokeStyle='#784031';ctx.lineWidth=9;ctx.stroke();
if(jaw>.22){ctx.fillStyle='#d98f86';ctx.beginPath();ctx.ellipse(793,lower-7,halfW*.52,Math.min(20,opening*.30),0,0,Math.PI);ctx.fill()}}
function drawBrow(amount){if(amount<.14)return;let a=clamp((amount-.14)*1.1);ctx.globalAlpha=a*.35;ctx.strokeStyle='#75645f';ctx.lineWidth=7;ctx.lineCap='round';for(let flip of [false,true]){ctx.save();if(flip){ctx.translate(W,0);ctx.scale(-1,1)}ctx.beginPath();ctx.moveTo(150,232-a*20);ctx.quadraticCurveTo(375,54-a*20,565,180-a*20);ctx.stroke();ctx.restore()}ctx.globalAlpha=1}
function render(t){requestAnimationFrame(render);if(!orig.complete||!clean.complete||!orig.naturalWidth)return;
ctx.clearRect(0,0,W,H);ctx.drawImage(orig,0,0,W,H);
if(mode==='facePage'){
if($('receiverStatus').textContent.startsWith('デモ')){let s=t/1000;target.jaw=Math.max(0,Math.sin(s*4.1))*.7;target.smile=(Math.sin(s*.75)+1)*.35;target.blink=(s%3.8<.15)?1:0;target.brow=.05}
else if(Date.now()-lastSeen>2200)target={jaw:0,smile:0,blink:0,brow:0};
}else target={jaw:0,smile:0,blink:0,brow:0};
for(let k in state)state[k]+=(target[k]-state[k])*.28;
drawMouth(state.jaw,state.smile);drawBlink(state.blink);drawBrow(state.brow)}requestAnimationFrame(render);
</script></body></html>
