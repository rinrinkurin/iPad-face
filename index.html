<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8d9c9"><title>おばあちゃんロボット・表情シンクロ</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif;color:#443b38;background:#f8d9c9}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{border:0;border-radius:15px;padding:12px 18px;background:#7e9a89;color:white;font-weight:700;cursor:pointer}button.secondary{background:#f4e7dc;color:#594e49}button:disabled{opacity:.5}.wrap{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;gap:16px}.panel{background:white;border:1px solid #e9ded4;box-shadow:0 12px 40px #5c463016;border-radius:25px;padding:24px;width:min(560px,100%)}h1{font-size:clamp(22px,4vw,32px);margin:0 0 10px}h2{font-size:20px;margin:0 0 10px}p{line-height:1.75}small,.hint{color:#847772}.buttons{display:flex;gap:10px;flex-wrap:wrap}.buttons button{flex:1}input{background:#f8d9c9;border:2px solid #dcd0c6;border-radius:12px;padding:12px;width:100%;font-size:18px}.hidden{display:none!important}.status{padding:9px 14px;border-radius:999px;background:#eee8e2;color:#5f5854;font-size:13px}.faceStage{height:100dvh;width:100vw;background:#f8d9c9;display:flex;align-items:center;justify-content:center;overflow:hidden}.faceSvg{height:100%;width:100%;max-height:100dvh;max-width:none}.faceControls{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;white-space:nowrap;background:#ffffffdf;padding:9px 12px;border-radius:18px;box-shadow:0 5px 22px #0001}.faceControls button{padding:7px 10px;font-size:12px}.faceControls .status{max-width:40vw;overflow:hidden;text-overflow:ellipsis}.room{font-variant-numeric:tabular-nums;letter-spacing:.12em;font-weight:800;font-size:24px}video{width:min(420px,100%);border-radius:20px;aspect-ratio:4/3;object-fit:cover;background:#202020;transform:scaleX(-1)}.metric{display:flex;justify-content:space-between;gap:10px;padding:4px 0}.meter{height:8px;width:100%;background:#f0e6de;border-radius:12px;overflow:hidden}.fill{height:100%;background:#88bba8;transition:width .12s}.phonebox{display:flex;flex-direction:column;gap:12px}.tag{font-size:13px;color:#86796d}.note{font-size:12px;color:#776f68}#statusPhone{font-size:14px}#previewFace{height:170px;background:#f8d9c9;border-radius:20px;overflow:hidden}#previewFace svg{width:100%;height:100%}
</style></head><body>
<div id="home" class="wrap"><div class="panel"><h1>おばあちゃんロボット・表情同期</h1><p>スマホの表情と、iPadのおばあちゃんロボットの顔を同期します。まず、この端末の役割を選んでね。</p><div class="buttons"><button id="choosePad">iPad：顔を表示</button><button id="choosePhone" class="secondary">スマホ：表情を送信</button><button id="chooseDemo" class="secondary">顔だけ試す</button></div><p class="hint">同じWebサイトを両方で開きます。スマホ側だけカメラ許可が必要です。</p></div></div>
<div id="pad" class="hidden"><div class="faceStage"><svg id="mainFace" class="faceSvg" viewBox="0 0 1536 1024" preserveAspectRatio="xMidYMid slice" aria-label="左右対称のおばあちゃんロボットの顔。薄桃色の背景、灰色の眉、茶色い目、しわと小さな鼻、微笑み" xmlns="http://www.w3.org/2000/svg">
<rect width="1536" height="1024" fill="#f8d9c9"/>
<defs><radialGradient id="skin" cx="50%" cy="48%" r="74%"><stop offset="0" stop-color="#ffe6d7"/><stop offset="1" stop-color="#f6d0bf"/></radialGradient></defs>
<rect width="1536" height="1024" fill="url(#skin)"/>
<!-- The whole left half, repeated by mirror reflection to keep perfect symmetry -->
<g id="halfFace">
<g id="browHalf"><path d="M155 243 Q280 122 438 112 Q544 106 571 188 Q574 200 558 193 Q360 111 158 251 Q144 258 155 243Z" fill="#918684"/></g>
<path d="M292 328 Q403 230 532 309" fill="none" stroke="#af7762" stroke-width="10" stroke-linecap="round"/>
<path d="M257 439 Q404 227 540 382" fill="none" stroke="#b87962" stroke-width="8" stroke-linecap="round"/>
<g id="eyeAnimated">
<path d="M235 485 Q336 368 426 376 Q523 370 579 485 Q585 496 572 497 Q416 532 251 492 Q229 501 224 483 Q220 470 235 485Z" fill="#fffaf7" opacity=".94"/>
<path d="M236 484 Q334 365 428 371 Q525 372 578 484" fill="none" stroke="#48281f" stroke-width="19" stroke-linecap="round"/>
<path d="M248 493 Q405 558 565 493" fill="none" stroke="#b87b65" stroke-width="7" stroke-linecap="round"/>
<ellipse cx="423" cy="444" rx="100" ry="81" fill="#4a291f"/>
<ellipse cx="410" cy="443" rx="83" ry="72" fill="#42271f"/>
<circle cx="432" cy="407" r="10" fill="#ffffff"/>
</g>
<path d="M121 489 Q180 531 229 519" fill="none" stroke="#ae745d" stroke-width="8" stroke-linecap="round"/>
<path d="M102 544 Q160 581 237 555" fill="none" stroke="#ae745d" stroke-width="8" stroke-linecap="round"/>
<path d="M359 554 Q449 649 564 551" fill="none" stroke="#b17660" stroke-width="9" stroke-linecap="round"/>
<path d="M121 645 Q281 827 501 676" fill="none" stroke="#b87a63" stroke-width="10" stroke-linecap="round"/>
<path d="M501 772 Q527 713 587 687" fill="none" stroke="#b87a63" stroke-width="9" stroke-linecap="round"/>
<!-- Nose bridge with mirrored nostril -->
<path d="M645 627 Q636 648 658 656 Q673 657 678 643 Q688 624 712 644 Q728 655 724 670" fill="none" stroke="#aa6a49" stroke-width="12" stroke-linecap="round"/>
</g>
<use href="#halfFace" transform="translate(1536,0) scale(-1,1)"/>
<path d="M742 687 Q768 720 794 687" fill="none" stroke="#a8694c" stroke-width="11" stroke-linecap="round"/>
<path id="mouthClosed" d="M583 779 Q768 850 953 779" stroke="#662e24" stroke-width="20" stroke-linecap="round" fill="none"/>
<ellipse id="mouthOpen" cx="768" cy="793" rx="165" ry="0" fill="#562820" opacity="0"/>
<path id="mouthLower" d="M632 856 Q768 921 904 856" stroke="#b87a63" stroke-width="8" stroke-linecap="round" fill="none"/>
</svg></div><div class="faceControls"><span id="padStatus" class="status">接続準備中</span><span id="padRoom" class="room">····</span><button id="copyRoom" class="secondary">コードをコピー</button><button id="hideBar" class="secondary">隠す</button></div><button id="showBar" class="hidden" style="position:fixed;bottom:10px;right:10px;background:#ffffffa0;color:#555;font-size:12px">設定</button></div>
<div id="phone" class="wrap hidden"><div class="panel phonebox"><h2>スマホから表情を送る</h2><label for="roomInput">iPadに表示された接続コード</label><input id="roomInput" autocomplete="off" autocapitalize="off" placeholder="例：A1B2C3D4"/><button id="connect">iPadに接続</button><div id="statusPhone" class="status">未接続</div><video id="camera" autoplay muted playsinline></video><button id="startCamera" class="secondary">カメラを起動する</button><div class="metric"><span>笑顔</span><span id="smileText">0%</span></div><div class="meter"><div id="smileFill" class="fill"></div></div><div class="metric"><span>口の開き</span><span id="mouthText">0%</span></div><div class="meter"><div id="mouthFill" class="fill"></div></div><p class="note">カメラ映像は送信せず、笑顔・口・目・眉などの表情データだけ送信します。接続はWebRTCによる暗号化通信です。カメラの処理は端末内で行います。</p></div></div>
<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script><script type="module">
const $=id=>document.getElementById(id), clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)), state={smile:0,mouth:0,blinkL:0,blinkR:0,brow:0}, target={...state}; let mode='',peer=null,conn=null,landmarker=null,camStream=null,lastDetect=0,lastSend=0,lastPacket=0,autoT=0;
function show(id){['home','pad','phone'].forEach(x=>$(x).classList.toggle('hidden',x!==id));mode=id;}
function setStatus(id,msg){$(id).textContent=msg;}
function updateFace(t){
 const smile=clamp(t.smile), mouth=clamp(t.mouth), brow=clamp(t.brow);
 const blink=clamp((t.blinkL+t.blinkR)/2);
 // Keep the left and right halves identical; smile adds a gentle friendly squint.
 const eyelid=clamp(1-blink*.94-Math.max(0,smile-.42)*.35,.055,1);
 $('eyeAnimated').setAttribute('transform',`translate(0 ${444*(1-eyelid)}) scale(1 ${eyelid})`);
 $('browHalf').setAttribute('transform',`translate(0 ${-31*brow})`);
 const cornerY=779-12*smile;
 $('mouthClosed').setAttribute('d',`M ${583-4*smile} ${cornerY} Q 768 ${834+45*smile} ${953+4*smile} ${cornerY}`);
 $('mouthClosed').setAttribute('opacity',String(clamp(1-mouth*2.5)));
 $('mouthOpen').setAttribute('ry',String(mouth*87));
 $('mouthOpen').setAttribute('rx',String(120+mouth*48));
 $('mouthOpen').setAttribute('opacity',String(clamp(mouth*4)));
 $('mouthLower').setAttribute('transform',`translate(0 ${mouth*70})`);
}
function animate(now){if(mode==='pad') {if(!conn||!conn.open||now-lastPacket>2500){autoT+=.018;target.smile=.24+.11*Math.sin(autoT*.6);target.mouth=.04+.18*Math.max(0,Math.sin(autoT*1.6))*(Math.sin(autoT*.3)>.2?1:0);target.blinkL=target.blinkR=(Math.sin(autoT*2.1)>.995)?1:0;target.brow=0;}for(let k of Object.keys(state))state[k]+=(target[k]-state[k])*.27;updateFace(state);}requestAnimationFrame(animate);} requestAnimationFrame(animate);
$('choosePad').onclick=()=>{show('pad');initPad();};$('chooseDemo').onclick=()=>{show('pad');$('padRoom').textContent='DEMO';setStatus('padStatus','自動表情プレビュー');};$('choosePhone').onclick=()=>{show('phone');const hash=new URLSearchParams(location.search).get('room');if(hash)$('roomInput').value=hash;};
function initPad(){if(typeof Peer==='undefined'){setStatus('padStatus','通信ライブラリを読み込めません');return;}peer=new Peer('obaface-'+Math.random().toString(36).slice(2,10).toUpperCase());peer.on('open',id=>{$('padRoom').textContent=id.replace('obaface-','');setStatus('padStatus','接続待ち');});peer.on('connection',c=>{if(conn&&conn.open){c.close();return;}conn=c;c.on('open',()=>setStatus('padStatus','スマホと接続中'));c.on('data',data=>{if(!data||data.type!=='expression')return;for(const k of Object.keys(target))if(typeof data[k]==='number'&&Number.isFinite(data[k]))target[k]=clamp(data[k]);lastPacket=performance.now();});c.on('close',()=>{setStatus('padStatus','切断されました');conn=null;});c.on('error',()=>setStatus('padStatus','通信エラー'));});peer.on('error',e=>setStatus('padStatus','接続エラー: '+e.type));}
$('copyRoom').onclick=async()=>{const text=$('padRoom').textContent;try{await navigator.clipboard.writeText(text);$('copyRoom').textContent='コピー済み';}catch(e){prompt('この接続コードをスマホに入力してね',text);}};
$('hideBar').onclick=()=>{document.querySelector('.faceControls').classList.add('hidden');$('showBar').classList.remove('hidden');};$('showBar').onclick=()=>{document.querySelector('.faceControls').classList.remove('hidden');$('showBar').classList.add('hidden');};
$('connect').onclick=()=>{const id=$('roomInput').value.trim();if(!id)return setStatus('statusPhone','接続コードを入力してください');if(typeof Peer==='undefined')return setStatus('statusPhone','通信ライブラリが読み込めません');if(!peer){peer=new Peer();peer.on('open',()=>connectTo(id));peer.on('error',e=>setStatus('statusPhone','通信エラー: '+e.type));}else if(peer.open)connectTo(id);else setStatus('statusPhone','通信の準備中');};
function connectTo(id){if(conn)conn.close();setStatus('statusPhone','接続中…');conn=peer.connect('obaface-'+id.toUpperCase().replace(/^OBAFACE-/i,''),{reliable:false});conn.on('open',()=>setStatus('statusPhone','接続成功！表情を送信しています'));conn.on('close',()=>setStatus('statusPhone','接続が切れました'));conn.on('error',()=>setStatus('statusPhone','接続に失敗しました'));setTimeout(()=>{if(conn&&!conn.open)setStatus('statusPhone','接続できません。iPadのコードを確認してください');},12000);}
async function startCamera(){if(camStream)return;try{setStatus('statusPhone','顔認識モデルを読み込み中…');const {FaceLandmarker,FilesetResolver}=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/+esm');let vision=await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm');const opts={baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',delegate:'GPU'},runningMode:'VIDEO',numFaces:1,outputFaceBlendshapes:true};try{landmarker=await FaceLandmarker.createFromOptions(vision,opts);}catch(e){opts.baseOptions.delegate='CPU';landmarker=await FaceLandmarker.createFromOptions(vision,opts);}camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:false});$('camera').srcObject=camStream;await $('camera').play();$('startCamera').textContent='カメラ起動中';$('startCamera').disabled=true;setStatus('statusPhone',conn?.open?'カメラ起動・送信中':'カメラ起動・接続待ち');requestAnimationFrame(track);}catch(e){setStatus('statusPhone','カメラを起動できません: '+(e.message||e));}}
$('startCamera').onclick=startCamera;
function track(now){if(!camStream||!landmarker)return;const video=$('camera');if(video.readyState>=2&&now-lastDetect>65){lastDetect=now;try{const res=landmarker.detectForVideo(video,now);if(res.faceBlendshapes?.length){const m=Object.fromEntries(res.faceBlendshapes[0].categories.map(c=>[c.categoryName,c.score]));const get=(x)=>m[x]||0;target.smile=clamp((get('mouthSmileLeft')+get('mouthSmileRight'))*1.5);target.mouth=clamp(get('jawOpen')*1.5);target.blinkL=clamp(get('eyeBlinkLeft')*1.25);target.blinkR=clamp(get('eyeBlinkRight')*1.25);target.brow=clamp((get('browInnerUp')+get('browOuterUpLeft')+get('browOuterUpRight'))*.9);const smile=Math.round(target.smile*100),mouth=Math.round(target.mouth*100);$('smileText').textContent=smile+'%';$('mouthText').textContent=mouth+'%';$('smileFill').style.width=smile+'%';$('mouthFill').style.width=mouth+'%';if(conn?.open&&now-lastSend>75){conn.send({type:'expression',...target});lastSend=now;}}else{setStatus('statusPhone','顔をカメラの正面に映してください');}}catch(e){console.warn('Face detection:',e);}}requestAnimationFrame(track);}
</script></body></html>
